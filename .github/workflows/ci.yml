name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches engines: the require(esm) floor NestJS v12 depends on.
        node: [20.19, 22.12, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter nestjs-mvc exec tsc -p tsconfig.json --noEmit
      - run: pnpm test
      - run: pnpm build
      # The package is ESM-only, but must stay loadable from CommonJS via
      # require(esm). That only works without top-level await, so assert it.
      - name: Assert the ESM build is require()-able from CommonJS
        run: node --input-type=commonjs -e "const m=require('./packages/core/dist/index.js');if(!m.InertiaModule)throw new Error('missing export');console.log('require(esm) OK:',Object.keys(m).length,'exports')"
