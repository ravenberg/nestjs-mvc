name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches engines: the require(esm) floor NestJS v12 depends on.
        node: [20.19, 22.12, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The package is ESM-only, but must stay loadable from CommonJS via
      # require(esm). That only works without top-level await, so assert it.
      - name: Assert the ESM build is require()-able from CommonJS
        run: node --input-type=commonjs -e "const m=require('./packages/core/dist/index.js');if(!m.MvcModule)throw new Error('missing export');console.log('require(esm) OK:',Object.keys(m).length,'exports')"

  e2e:
    name: Kitchen sink (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The kitchen sink imports nestjs-mvc from its build output.
      - run: pnpm build
      - run: pnpm --filter kitchen-sink exec playwright install --with-deps chromium
      # playwright.config.ts starts the dev server itself; CI=1 selects one worker and a retry.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/kitchen-sink/playwright-report
            apps/kitchen-sink/test-results
          retention-days: 7
