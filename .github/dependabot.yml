version: 2
updates:
  # Dependency bumps, but never fresh ones: the seven-day cooldown mirrors
  # pnpm's minimumReleaseAge. Security fixes for known advisories bypass it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 3
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies]
